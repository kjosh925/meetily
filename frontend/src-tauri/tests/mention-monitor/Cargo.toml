[package]
name = "mention-monitor-tests"
version = "0.1.0"
edition = "2021"
publish = false

# Test the real policy and inference adapter without audio devices or Tauri sidecars.
[workspace]

[lib]
path = "lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"
reqwest = { version = "0.11", features = ["json"] }
